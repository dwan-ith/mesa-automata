[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-von-neumann"
version = "0.2.0"
description = "Von Neumann's 29-State Self-Reproducing Cellular Automaton in Mesa"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "dwan-ith"}
]
keywords = ["cellular-automata", "mesa", "agent-based-modeling", "von-neumann", "self-replication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mesa>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # numba is optional: it only accelerates the exhaustive golden test.
    "numba>=0.57",
]
viz = [
    "solara>=1.0",
]

[tool.setuptools.packages.find]
include = ["vn_automata*"]

[tool.setuptools.package-data]
vn_automata = ["data/*.rule", "data/*.md", "visualizer/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
